<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
            }

            * {
                font-family: sans-serif;
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }

            .container {
                width: 100%;
                height: 100%;
                display: grid;
                align-items: center;
                justify-content: center;
            }

            .calculator {
                border-radius: 20px;
                width: 380px;
                height: fit-content;
                padding: 10px 20px;
                display: grid;
                background-color: black;
                grid-template-rows: 200px 500px;
            }

            .calculator > .input-screen {
                display: grid;
                grid-template-columns: repeat(4, 75px);
                justify-content: center;
                align-items: center;
                gap: 10px;
            }

            .calculator > .input-screen > button {
                width: 75px;
                cursor: pointer;
                height: 75px;
                outline: none;
                background: white;
                font-size: 4ch;
                border: none;
                border-radius: 100%;
            }

            .calculator > .input-screen > button:nth-child(17) {
                border-radius: 75px;
                width: 100%;
                grid-column: 1 / 3;
            }

            .calculator > .input-screen > button:nth-child(4n),
            .calculator > .input-screen > button:last-child {
                background-color: orange;
            }

            .calculator > .input-screen > button.input-number {
                background-color: rgba(255, 255, 255, 0.25);
                color: white;
            }

            .calculator > .output-screen {
                color: white;
                display: grid;
                justify-content: end;
                align-items: end;
                padding: 20px;
                grid-template-columns: 100%;
            }

            .calculator > .output-screen > .output-container {
                width: 100%;
                height: 60px;
                align-items: center;
                justify-content: end;
                display: flex;
                scrollbar-width: thin;
                scrollbar-color: orange transparent;
                flex-direction: row;
                overflow-x: auto;
                font-size: 3rem;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="calculator">
                <div class="output-screen">
                    <div id="output" class="output-container">

                    </div>
                </div>
                <div class="input-screen">
                    <button id="ac">AC</button>
                    <button id="plusminus">&plusmn;</button>
                    <button class="percent" op="%">&percnt;</button>
                    <button class="operator" op="/">&divide;</button>

                    <button class="input-number">7</button>
                    <button class="input-number">8</button>
                    <button class="input-number">9</button>
                    <button class="operator" op="*">&times;</button>

                    <button class="input-number">4</button>
                    <button class="input-number">5</button>
                    <button class="input-number">6</button>
                    <button class="operator" op="-">&minus;</button>

                    <button class="input-number">1</button>
                    <button class="input-number">2</button>
                    <button class="input-number">3</button>
                    <button class="operator" op="+">&plus;</button>

                    <button class="input-number">0</button>
                    <button id="dot" class="input-number">.</button>
                    <button id="result">&equals;</button>
                </div>
            </div>
        </div>

        <script
            src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"
        ></script>
        <script>
            function main() {
                const input = ["", ""];
                const symbol = ["", ""];
                let operator = "";

                function reset() {
                    operator = "";
                    input[0] = "";
                    input[1] = "";
                }

                function resetSymbol() {
                    symbol[0] = "";
                    symbol[1] = "";
                }

                function out() {
                    $("#output").text(
                        input.map((d, i) => `${symbol[i]}${d}`).join(operator),
                    );
                }

                function setResult() {
                    try {
                        input[0] = Number(eval(
                            input
                                .map((d, i) => `${symbol[i]}${d}`)
                                .join(operator),
                        ).toFixed(2));

                        if(Number.isNaN(input[0]) || input[0] === Infinity || input[0] === -Infinity){
                            input[0] = "Err div by 0";
                        }else{
                            if(input[0].toString().length > 13){
                                input[0] = input[0].toExponential(2);
                            }
                        }


                    } catch (err) {
                        console.log(err.message)
                        input[0] = "Error";
                    }
                }

                $(".input-number").click(function (index) {
                    let position = 0;
                    if (operator.length !== 0) {
                        position = 1;
                    }

                    if (
                        $(this).attr("id") === "dot" &&
                        input[position].includes(".")
                    ) {
                        return;
                    }
                    input[position] += $(this).text();
                    out();
                });

                $("#plusminus").click(function () {
                    let position = 0;
                    if (operator.length !== 0) {
                        position = 1;
                    }
                    symbol[position] = symbol[position].startsWith("-")
                        ? ""
                        : "-";
                    out();
                });

                $(".percent").click(function () {
                    let position = 0;
                    if (operator.length !== 0) {
                        position = 1;
                    }
                    const num = Number(input[position]);
                    if (Number.isNaN(num) || num === Infinity || num === -Infinity) {
                        return;
                    }
                    input[position] = Number(num / 100);
                    if(input[position].toString().length > 13){
                        input[position] = input[position].toExponential(2);
                    }
                    out();
                });

                $(".operator").click(function () {
                    if (input[0].length === 0) {
                        return;
                    }

                    if (operator.length !== 0) {
                        if (input[1].length !== 0) {
                            setResult();
                            operator = $(this).attr("op");
                            input[1] = "";
                            resetSymbol();
                            out();
                        }
                        return;
                    }
                    operator = $(this).attr("op");
                    out();
                });

                $("#ac").click(function () {
                    reset();
                    resetSymbol();
                    out();
                });

                $("#result").click(function () {
                    setResult();
                    input[1] = "";
                    operator = "";
                    resetSymbol();
                    out();
                });
            }

            $(document.body).ready(main);
        </script>
    </body>
</html>
