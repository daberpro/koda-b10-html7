<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
        }

        * {
            font-family: sans-serif;
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container{
            width: 100%;
            height: 100%;
            display: grid;
            align-items: center;
            justify-content: center;
        }

        .calculator{
            border-radius: 20px;
            width: fit-content;
            height: fit-content;
            padding: 10px 20px;
            display: grid;
            background-color: black;
            grid-template-rows: 200px 500px;
        }

        .calculator > .input-screen{
            display: grid;
            grid-template-columns: repeat(4,75px);
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .calculator > .input-screen > button {
            width: 75px;
            cursor: pointer;
            height: 75px;
            outline: none;
            background: white;
            font-size: 4ch;
            border: none;
            border-radius: 100%;
        }

        .calculator > .input-screen > button:nth-child(17){
            border-radius: 75px;
            width: 100%;
            grid-column: 1 / 3;
        }

        .calculator > .input-screen > button:nth-child(4n), .calculator > .input-screen > button:last-child{
            background-color: orange;
        }

        .calculator > .input-screen > button.input-number{
            background-color: rgba(255,255,255,0.25);
            color: white;
        }

        .calculator > .output-screen {
            color: white;
            display: grid;
            justify-content: end;
            align-items: end;
            padding: 20px;
        }

        .calculator > .output-screen > span {
            font-size: 3rem;
        }


    </style>
</head>

<body>

    <div class="container">

        <div class="calculator">
            <div class="output-screen">
                <span>6350</span>
            </div>
            <div class="input-screen">
    
                <button>AC</button>
                <button>&plusmn;</button>
                <button>&percnt;</button>
                <button>&divide;</button>
                
                <button class="input-number">7</button>
                <button class="input-number">8</button>
                <button class="input-number">9</button>
                <button>&times;</button>
    
                <button class="input-number">4</button>
                <button class="input-number">5</button>
                <button class="input-number">6</button>
                <button>&minus;</button>
    
                <button class="input-number">1</button>
                <button class="input-number">2</button>
                <button class="input-number">3</button>
                <button>&plus;</button>
    
                <button class="input-number">0</button>
                <button class="input-number">&dot;</button>
                <button>&equals;</button>
            </div>
        </div>
    </div>

</body>

</html>
